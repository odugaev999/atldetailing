backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "content"
    label: "Site Content"
    files:
      - file: "content.json"
        label: "ATL Mobile Detailing — Site Content"
        name: "content"
        fields:
          - { label: "Phone (digits only, e.g. 6472809429)", name: "phone", widget: "string", hint: "Shown as-is on the site, e.g. 647-280-9429" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Service Area", name: "serviceArea", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Leave empty to use the default text logo" }
          - { label: "Hero background photo", name: "heroImage", widget: "image", required: false, hint: "Leave empty to use the default dark background" }
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow tag", name: "eyebrow", widget: "string" }
              - { label: "Headline — line 1 (white)", name: "titleLine1", widget: "string" }
              - { label: "Headline — line 2 (gold)", name: "titleLine2", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
          - label: "Packages"
            name: "packages"
            widget: "list"
            summary: "{{name}} — ${{price}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Base price (5 seats, leather — e.g. 99)", name: "price", widget: "number", value_type: "int" }
              - { label: "Surcharge for 7 seats", name: "seatSurcharge", widget: "number", value_type: "int", default: 30 }
              - { label: "Discount for fabric interior (0 for Basic)", name: "fabricDiscount", widget: "number", value_type: "int", default: 0 }
              - { label: "Show 'Most Popular' badge", name: "featured", widget: "boolean", default: false }
              - { label: "Short description (Premium/Platinum only, optional)", name: "description", widget: "text", required: false }
              - label: "Exterior features"
                name: "exterior"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - label: "Interior features"
                name: "interior"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
          - label: "Custom-quote categories (RV / Jet / Boat / Specialty)"
            name: "quoteCategories"
            widget: "list"
            field: { label: "Category name", name: "value", widget: "string" }
          - label: "Portfolio Gallery"
            name: "gallery"
            widget: "list"
            summary: "{{category}}"
            fields:
              - { label: "Photo", name: "image", widget: "image", required: false, hint: "Leave empty if this entry is a video (fill in 'Video file' below instead)" }
              - { label: "Video file", name: "video", widget: "file", required: false, hint: "Leave empty for a photo entry. For video: keep clips short and compressed — under ~30-50MB each, MP4 format, ideally 1080p or lower. Large 4K phone footage can be hundreds of MB and will be slow to upload and slow for visitors to load." }
              - { label: "Video thumbnail (optional)", name: "poster", widget: "image", required: false, hint: "Optional cover image shown before the video is played" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Exterior", "Interior", "Before & After", "Full Detail", "Video"]
          - label: "Why Choose Us / Built On Trust section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Kicker (small tag above heading)", name: "kicker", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Paragraph text", name: "text", widget: "text", hint: "Be accurate about what you bring vs. what you need on-site (e.g. water/power access)" }
              - label: "Checkmark points (3 short highlights)"
                name: "points"
                widget: "list"
                field: { label: "Point", name: "value", widget: "string" }
